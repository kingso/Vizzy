[package]
name = "Vizzy"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cpal = "0.17.3"
dirs = "6.0.0"
env_logger = "0.11.9"
image = { version = "0.25.6", default-features = false, features = ["png"] }
log = "0.4.29"
pollster = "0.4.0"
ringbuf = "0.4.8"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
symphonia = { version = "0.5.5", features = ["mp3"] }
toml = "0.9.7"
wgpu = "26.0.1"
winit = "0.30.13"

[build-dependencies]
embed-resource = "3.0.6"
ico = "0.4.0"
image = { version = "0.25.6", default-features = false, features = ["png"] }
resvg = "0.44.0"
